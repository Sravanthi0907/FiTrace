<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FiTrace</title>
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #ff006e;
            --dark-bg: #121212;
            --panel-bg: rgba(30, 30, 40, 0.85);
            --text-glow: 0 0 10px rgba(0, 229, 255, 0.8);
            --btn-glow: 0 0 15px rgba(0, 229, 255, 0.6);
            --input-glow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
        }

        @font-face {
            font-family: 'Cyber';
            src: url('https://cdnjs.cloudflare.com/ajax/libs/fonts/Orbitron-Regular.ttf');
        }

        body {
            background: var(--dark-bg);
            color: white;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.1) 0%, transparent 50%),
                linear-gradient(to right, rgba(255, 0, 110, 0.03), rgba(0, 229, 255, 0.03));
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    transparent,
                    transparent 50px,
                    rgba(0, 229, 255, 0.03) 50px,
                    rgba(0, 229, 255, 0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0, 229, 255, 0.03) 50px,
                    rgba(0, 229, 255, 0.03) 51px
                );
            z-index: -1;
        }

        .container {
            width: 100%;
            padding-top: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Navbar styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 2px 15px rgba(0, 229, 255, 0.2);
        }

        .navbar-brand {
            color: var(--primary);
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: var(--text-glow);
            animation: pulseText 3s infinite;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .user-email::before {
            content: "👤 ";
            margin-right: 5px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: linear-gradient(90deg, var(--secondary), rgba(255, 0, 110, 0.7));
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(255, 0, 110, 0.4);
        }

        .logout-btn:hover {
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.6);
            transform: translateY(-2px);
        }

        /* Calendar styles */
        .calendar-box {
            width: 90%;
            max-width: 900px;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            position: relative;
            transform-style: preserve-3d;
            animation: panelFloat 6s ease-in-out infinite;
            border: 1px solid rgba(0, 229, 255, 0.3);
            backdrop-filter: blur(5px);
            margin-bottom: 40px;
        }

        .calendar-box::before, .calendar-box::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid transparent;
            border-radius: 10px;
            animation: borderGlow 4s linear infinite;
            z-index: -1;
        }

        .calendar-box::after {
            animation-delay: -2s;
        }

        .calendar-box h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
            position: relative;
            text-shadow: var(--text-glow);
        }

        .calendar-box h1::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            bottom: -10px;
            left: 25%;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--primary);
            box-shadow: var(--input-glow);
            transform: translateY(-2px);
        }

        .calendar {
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-label {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }

        .day {
            height: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: right;
            padding: 5px;
            font-size: 16px;
            position: relative;
            background: rgba(30, 30, 40, 0.5);
            transition: all 0.3s ease;
        }

        .day:hover {
            background: rgba(0, 229, 255, 0.1);
            transform: translateZ(5px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            z-index: 10;
        }

        .day a {
            color: white;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }

        .day a:hover {
            color: var(--primary);
            text-shadow: var(--text-glow);
        }

        .day.highlighted {
            background: rgba(0, 229, 255, 0.15);
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .day.highlighted::after {
            content: "TODAY";
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-size: 10px;
            color: var(--primary);
            text-shadow: var(--text-glow);
        }

        .day.empty {
            background: rgba(0, 0, 0, 0.2);
        }

        /* Tooltip styles */
        .tooltip {
            display: none;
            position: absolute;
            background: rgba(18, 18, 24, 0.95);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            z-index: 1000;
            backdrop-filter: blur(10px);
            max-width: 350px;
            color: white;
            animation: fadeIn 0.3s;
        }

        .tooltip.small {
            width: auto;
            padding: 8px;
        }

        .tooltip h3 {
            margin: 0;
            font-size: 16px;
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
            margin-bottom: 10px;
        }

        .tooltip p {
            margin: 8px 0;
            font-size: 14px;
        }

        .tooltip canvas {
            display: block;
            width: 100%;
            height: auto;
            margin-top: 10px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 4px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 1s;
        }


        @keyframes borderGlow {
            0%, 100% {
                border-color: var(--primary);
                box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
            }
            50% {
                border-color: var(--secondary);
                box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
            }
        }

        @keyframes pulseText {
            0%, 100% { text-shadow: 0 0 5px rgba(0, 229, 255, 0.5); }
            50% { text-shadow: 0 0 15px rgba(0, 229, 255, 0.8); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 15px;
                height: auto;
                flex-direction: column;
                padding: 10px;
            }
            
            .user-info {
                flex-direction: column;
                gap: 10px;
                margin-top: 10px;
            }
            
            .container {
                padding-top: 120px;
            }
            
            .calendar-box {
                padding: 15px;
            }
            
            .day {
                height: 60px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar with user info and logout -->
    <div class="navbar">
        <div class="navbar-brand">FiTrace</div>
        <div class="user-info">
            <div class="user-email">{{ user_email }}</div>
            <a href="{{ url_for('index') }}" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container fade-in">
        <div class="calendar-box">
            <h1>Calendar : {{ year }}-{{ '%02d'|format(month) }}</h1>
            <div class="nav-links">
                <a href="{{ url_for('calendar', year=prev_month.year, month=prev_month.month) }}">&lt; Previous Month</a>
                <a href="{{ url_for('calendar', year=next_month.year, month=next_month.month) }}">Next Month &gt;</a>
            </div>
            <div class="calendar">
                <div class="week">
                    <div class="day-label">Sun</div>
                    <div class="day-label">Mon</div>
                    <div class="day-label">Tue</div>
                    <div class="day-label">Wed</div>
                    <div class="day-label">Thu</div>
                    <div class="day-label">Fri</div>
                    <div class="day-label">Sat</div>
                </div>
                <div class="week">
                    {% for day in days %}
                        {% if day %}
                            <div class="day {% if day == today %}highlighted{% endif %}" data-date="{{ day.strftime('%Y-%m-%d') }}" data-workouts='{{ workouts[day.strftime("%Y-%m-%d")] | tojson }}'>
                                <a href="{{ url_for('workout', date=day.strftime('%Y-%m-%d')) }}">{{ day.day }}</a>
                            </div>
                        {% else %}
                            <div class="day empty"></div>
                        {% endif %}
                        {% if loop.index % 7 == 0 and not loop.last %}
                            </div><div class="week">
                        {% endif %}
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip">
        <h3>Workouts</h3>
        <p id="tooltip-content"></p>
        <canvas id="tooltip-chart" width="300" height="200"></canvas>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Additional script for tooltip functionality with workout data
        document.addEventListener('DOMContentLoaded', function() {
            const days = document.querySelectorAll('.day:not(.empty)');
            const tooltip = document.getElementById('tooltip');
            const tooltipContent = document.getElementById('tooltip-content');
            const tooltipChart = document.getElementById('tooltip-chart');
            let chart = null;
            
            days.forEach(day => {
                day.addEventListener('mouseenter', function(e) {
                    const date = this.getAttribute('data-date');
                    const workouts = JSON.parse(this.getAttribute('data-workouts') || '[]');
                    
                    if (workouts.length > 0) {
                        tooltipContent.innerHTML = `<strong>${date}</strong><br>` + 
                            workouts.map(w => `${w.exercise}: ${w.weight}kg x ${w.reps}`).join('<br>');
                        
                        // Create chart data
                        if (chart) {
                            chart.destroy();
                        }
                        
                        const ctx = tooltipChart.getContext('2d');
                        const exerciseNames = [...new Set(workouts.map(w => w.exercise))];
                        const chartData = {
                            labels: exerciseNames,
                            datasets: [{
                                label: 'Weight (lbs)',
                                data: exerciseNames.map(exercise => {
                                    const workout = workouts.find(w => w.exercise === exercise);
                                    return workout ? workout.weight : 0;
                                }),
                                backgroundColor: 'rgba(0, 229, 255, 0.5)',
                                borderColor: '#00e5ff',
                                borderWidth: 1
                            }]
                        };
                        
                        chart = new Chart(ctx, {
                            type: 'bar',
                            data: chartData,
                            options: {
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        grid: {
                                            color: 'rgba(255, 255, 255, 0.1)'
                                        },
                                        ticks: {
                                            color: 'rgba(255, 255, 255, 0.7)'
                                        }
                                    },
                                    x: {
                                        grid: {
                                            color: 'rgba(255, 255, 255, 0.1)'
                                        },
                                        ticks: {
                                            color: 'rgba(255, 255, 255, 0.7)'
                                        }
                                    }
                                },
                                plugins: {
                                    legend: {
                                        labels: {
                                            color: 'rgba(255, 255, 255, 0.7)'
                                        }
                                    }
                                }
                            }
                        });
                        
                        // Position tooltip
                        tooltip.style.display = 'block';
                        const rect = this.getBoundingClientRect();
                        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                        
                        tooltip.style.top = (rect.top + scrollTop - tooltip.offsetHeight - 10) + 'px';
                        tooltip.style.left = (rect.left + (rect.width / 2) - (tooltip.offsetWidth / 2)) + 'px';
                    }
                });
                
                day.addEventListener('mouseleave', function() {
                    tooltip.style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
